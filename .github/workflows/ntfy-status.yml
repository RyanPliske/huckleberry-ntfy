# Push Huckleberry feed/diaper summary to your phone via ntfy.
#
# Triggers:
#   workflow_dispatch      — Actions “Run workflow” or REST dispatches (see examples/RELIABLE_TRIGGER.md).
#   repository_dispatch    — Reliable alternative to flaky native `schedule`; POST from cron-job.org / VPS.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   HUCKLEBERRY_EMAIL
#   HUCKLEBERRY_PASSWORD
#   HUCKLEBERRY_TIMEZONE   e.g. America/Chicago
#   NTFY_TOPIC             secret topic you subscribed to in the ntfy app
#
# Optional secrets:
#   NTFY_TITLE             title suffix after 🟢 when OK (default: Huckleberry)
#   NTFY_SERVER            default https://ntfy.sh

name: NTFY status

on:
  workflow_dispatch:
  repository_dispatch:
    types: [ntfy]

permissions:
  contents: read

concurrency:
  group: ntfy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Workflow trigger
        run: |
          echo "github.event_name=${{ github.event_name }}"
          echo "Expected: workflow_dispatch | repository_dispatch"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --no-dev

      - name: Push status to ntfy
        env:
          HUCKLEBERRY_EMAIL: ${{ secrets.HUCKLEBERRY_EMAIL }}
          HUCKLEBERRY_PASSWORD: ${{ secrets.HUCKLEBERRY_PASSWORD }}
          HUCKLEBERRY_TIMEZONE: ${{ secrets.HUCKLEBERRY_TIMEZONE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TITLE: ${{ secrets.NTFY_TITLE }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
        run: uv run python examples/push_ntfy_status.py
