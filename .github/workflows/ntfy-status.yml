# Push Huckleberry feed/diaper summary to your phone via ntfy.
#
# Schedule rules (see GitHub docs: events → schedule):
#   - Workflow file MUST exist on the default branch or schedules do not run.
#   - Scheduled workflows run only on the default branch.
#   - Forks: schedules are often disabled until you enable Actions for the fork.
#   - Public repos: schedules auto-disable after 60 days without repo activity (re-enable in Actions UI).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   HUCKLEBERRY_EMAIL
#   HUCKLEBERRY_PASSWORD
#   HUCKLEBERRY_TIMEZONE   e.g. America/Chicago
#   NTFY_TOPIC             secret topic you subscribed to in the ntfy app
#
# Optional secrets:
#   NTFY_TITLE             notification title (default: Huckleberry)
#   NTFY_SERVER            default https://ntfy.sh

name: NTFY status

on:
  schedule:
    # Every 5 minutes in America/Chicago (GitHub minimum interval is 5 minutes).
    - cron: "*/5 * * * *"
      timezone: "America/Chicago"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ntfy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Workflow trigger
        run: |
          echo "github.event_name=${{ github.event_name }}"
          echo "If this was scheduled, event_name should be: schedule"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --no-dev

      - name: Push status to ntfy
        env:
          HUCKLEBERRY_EMAIL: ${{ secrets.HUCKLEBERRY_EMAIL }}
          HUCKLEBERRY_PASSWORD: ${{ secrets.HUCKLEBERRY_PASSWORD }}
          HUCKLEBERRY_TIMEZONE: ${{ secrets.HUCKLEBERRY_TIMEZONE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TITLE: ${{ secrets.NTFY_TITLE }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
        run: uv run python examples/push_ntfy_status.py
